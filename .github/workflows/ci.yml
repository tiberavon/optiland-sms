# CI for the optiland-sms repository.
#
# Authored in the private monorepo at
# src-python/optiland_sms/.github/workflows/ci.yml, and published to this
# repository's root, because a satellite's published tree is rooted at its
# own package directory.
#
# The tests trace the fixture lens on numpy and torch and check the gradient,
# so torch is installed, from its CPU index: the default wheel carries CUDA
# libraries the tests never use. They need Optiland 0.6.3 or later, from
# PyPI, and not ray_tracing_shapely (the fixture is a profile.json).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor and not a choice: optiland requires >=3.11.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check optiland_sms tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build --outdir dist .
      - run: twine check --strict dist/*
