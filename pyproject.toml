[build-system]
# >=77 for PEP 639: `license` as an SPDX string rather than a table.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "optiland-sms"
version = "0.1.0"
description = "Miñano-Benítez SMS nonimaging profiles as an Optiland entry-point surface-geometry plugin"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Michele Benetti", email = "micheleben@gmail.com"},
    {name = "ray-tracing-shapely authors and contributors"},
]
keywords = ["optiland", "ray-tracing", "optics", "sms", "nonimaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    # 0.6.3 is the first release whose Newton-Raphson geometries give exact
    # first-order gradients through the intersection (the one-step implicit
    # correction). The plugin entry-point groups exist from 0.6.2.
    "optiland>=0.6.3",
]

[project.optional-dependencies]
# Gradients: Optiland's torch backend.
torch = [
    "torch",
]
dev = [
    "pytest>=7.0.0",
    "torch",
]

# Optiland's plugin loader calls register() the first time it meets a surface
# type it does not know: "sms_spline" needs no import of this package.
[project.entry-points."optiland.surfaces"]
sms_spline = "optiland_sms.register:register"

[project.urls]
Homepage = "https://github.com/tiberavon/optiland-sms"
Repository = "https://github.com/tiberavon/optiland-sms"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["optiland_sms", "optiland_sms.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The same blocking set as the core distribution: pyflakes finds real
# defects rather than style. Without this section ruff falls back to its own
# defaults -- 88 columns and a wider ruleset -- and this distribution would
# report 83 findings instead of none, which is a lint job red on arrival.
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
